name = "meza"
main = "worker/index.js"
compatibility_date = "2026-08-26"
workers_dev = true

# Dominio propio (Cloudflare Registrar): la landing y todos los menús viven aquí.
# workers.dev sigue funcionando como respaldo.
routes = [
  { pattern = "pidemeza.com", custom_domain = true },
  { pattern = "www.pidemeza.com", custom_domain = true },
]

# Sirve el build de Vite (dist/) como assets estáticos.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"   # /nuevo, /?r=... → index.html

[vars]
MOTOR = "gemini"
RESOLUCION = "1K"
LIMITE_DIA = "120"
LIMITE_IP = "40"
# Envío automático del cierre de caja por Telegram: usuario del bot (sin @). El token y el
# secreto del webhook van como secrets: TELEGRAM_TOKEN, TELEGRAM_WEBHOOK_SECRET. Opcional:
# WEBHOOK_CIERRE (URL de n8n/Make que recibe el cierre con el PDF en base64).
TELEGRAM_BOT = ""

# Cartas de los restaurantes (panel del dueño / alta).
[[kv_namespaces]]
binding = "CARTAS"
id = "a0383838734a44be8d41f48811505069"

# Sala en tiempo real por local: pedidos, pagos (QR + comprobante), cocina y
# caja sincronizados por WebSocket. Un Durable Object (SQLite) por local.
[[durable_objects.bindings]]
name = "SALA"
class_name = "Sala"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala"]

[observability]
enabled = true
